name: Camino reminder API smoke
on:
  push:
    branches: [feat/automatic-camino-push-reminders]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify reminder API and protected scheduler
        run: |
          set -euo pipefail
          token="$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('base64url'))")"
          base="https://qoensghjemruqafrbmjd.supabase.co/functions/v1"
          for action in reminder_settings save_reminders; do
            status="$(curl -sS --max-time 30 -o /tmp/result -w '%{http_code}' -H 'Origin: https://mikefaehch.github.io' -H 'Content-Type: application/json' --data "{\"action\":\"$action\",\"token\":\"$token\",\"enabled\":true,\"morningTime\":\"07:00\",\"eveningTime\":\"19:00\"}" "$base/camino-push-device")"
            test "$status" = "404"
            jq -e '.error=="device_not_registered"' /tmp/result >/dev/null
          done
          status="$(curl -sS --max-time 30 -o /tmp/result -w '%{http_code}' -H 'Content-Type: application/json' -d '{}' "$base/camino-push-reminders")"
          test "$status" = "403"
          jq -e '.error=="forbidden"' /tmp/result >/dev/null
          echo "Device isolation and cron authentication OK"
