name: Camino quality
on:
  push:
    branches: [main, 'fix/**', 'feature/**']
  pull_request:
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache isolation regression
        run: node tests/cache-isolation.mjs
      - name: Install Playwright for existing browser checks
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Existing Camino checks
        run: npm run check
