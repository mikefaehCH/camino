name: Camino push status API test
on:
  push:
    branches: [feat/push-delivery-diagnostics]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check push status endpoint
        run: |
          set -euo pipefail
          token="$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('base64url'))")"
          url="https://qoensghjemruqafrbmjd.supabase.co/functions/v1/camino-push-device"
          status="$(curl -sS --max-time 30 -o /tmp/result -w '%{http_code}' -H 'Origin: https://mikefaehch.github.io' -H 'Content-Type: application/json' --data "{\"action\":\"status\",\"token\":\"$token\"}" "$url")"
          test "$status" = "404"
          jq -e '.error=="device_not_registered"' /tmp/result >/dev/null
          echo "Status endpoint correctly rejects unknown devices"
