name: Camino remote push API smoke test
on:
  push:
    branches: [feat/iphone-remote-push-self-test]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify VAPID config endpoint and anonymous test isolation
        run: |
          set -euo pipefail
          token="$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('base64url'))")"
          url="https://qoensghjemruqafrbmjd.supabase.co/functions/v1/camino-push-device"
          response="$(curl --fail-with-body --silent --show-error --max-time 30 -H 'Origin: https://mikefaehch.github.io' -H 'Content-Type: application/json' -d "{\"action\":\"config\",\"token\":\"$token\"}" "$url")"
          echo "$response" | jq -e '.publicKey | length >= 80' >/dev/null
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 30 -H 'Origin: https://mikefaehch.github.io' -H 'Content-Type: application/json' -d "{\"action\":\"test\",\"token\":\"$token\"}" "$url")"
          test "$status" = "404"
          echo "VAPID config and device isolation OK"
